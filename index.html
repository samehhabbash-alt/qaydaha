<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6b5d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>قيّدها</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap">
<style>
/* قيّدها: واجهة عربية RTL بخط Cairo، أحجام كبيرة للقراءة بسهولة على الموبايل. الفكرة: دفتر حسابات عصري، أخضر داكن هادئ، أرقام ثقيلة وواضحة، وألوان الحالة للمديونيات فقط. */
:root {
  --bg: #eef3f1; --surface: #ffffff; --surface2: #e3ebe8; --ink: #0f2b26; --muted: #3f5a54; --line: #cbd8d3;
  --accent: #0a6657; --accent2: #14917b; --accent-ink: #ffffff; --accent-soft: #d6efe8;
  --recv: #b01f14; --recv-bg: #fde7e4; --pay: #8a4f06; --pay-bg: #fbecd0; --good: #086b42; --good-bg: #daf2e5;
  --c-sales: #0a6657; --c-buy: #3f54a3; --c-exp: #b86e0c;
  --shadow: 0 1px 2px rgba(15,43,38,.08), 0 8px 24px rgba(15,43,38,.08);
  --f: 'Cairo', 'Segoe UI', Tahoma, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1311; --surface: #121f1b; --surface2: #1b2c27; --ink: #eaf4f0; --muted: #b3c8c1; --line: #2b4038;
    --accent: #3fc2a8; --accent2: #2aa58c; --accent-ink: #03221b; --accent-soft: #15382f;
    --recv: #ff9488; --recv-bg: #3c1d19; --pay: #f5bd68; --pay-bg: #3b2a11; --good: #6ddba2; --good-bg: #113a28;
    --c-sales: #3fc2a8; --c-buy: #96a5f4; --c-exp: #f5bd68; --shadow: 0 1px 2px rgba(0,0,0,.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1311; --surface: #121f1b; --surface2: #1b2c27; --ink: #eaf4f0; --muted: #b3c8c1; --line: #2b4038;
  --accent: #3fc2a8; --accent2: #2aa58c; --accent-ink: #03221b; --accent-soft: #15382f;
  --recv: #ff9488; --recv-bg: #3c1d19; --pay: #f5bd68; --pay-bg: #3b2a11; --good: #6ddba2; --good-bg: #113a28;
  --c-sales: #3fc2a8; --c-buy: #96a5f4; --c-exp: #f5bd68; --shadow: 0 1px 2px rgba(0,0,0,.5); color-scheme: dark;
}
:root[data-contrast="high"] { --muted: var(--ink); --line: var(--ink); }

[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { height: 100%; font-size: 20px; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html[data-fs="0"] { font-size: 17.5px; }
html[data-fs="2"] { font-size: 23px; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--f); font-weight: 500; font-size: 1rem; line-height: 1.6;
  padding-left: max(.8rem, env(safe-area-inset-left, 0px)); padding-right: max(.8rem, env(safe-area-inset-right, 0px)); padding-block: 0 7.5rem; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 40; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; font-weight: 800; }
:root[data-contrast="high"] .card, :root[data-contrast="high"] .btn, :root[data-contrast="high"] .chip, :root[data-contrast="high"] .kpi,
:root[data-contrast="high"] .iconbtn, :root[data-contrast="high"] input, :root[data-contrast="high"] select, :root[data-contrast="high"] .msg.bot { border-width: 2px; }
:root[data-contrast="high"] body { font-weight: 600; }

/* الشريط العلوي */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; gap: .5rem; padding: .7rem 0 .6rem; background: var(--bg); }
.brand { font-weight: 900; font-size: 1.75rem; flex: 1; min-width: 0; line-height: 1.15; color: var(--accent); }
.brand small { display: block; font-size: .72rem; font-weight: 600; color: var(--muted); line-height: 1.3; margin-top: .1rem; }
.iconbtn { width: 2.9rem; height: 2.9rem; flex: none; display: grid; place-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 1rem; position: relative; font-weight: 800; }
.iconbtn .ic { width: 1.4rem; height: 1.4rem; }
.dot { width: .7rem; height: .7rem; border-radius: 50%; background: var(--muted); position: absolute; top: .3rem; inset-inline-end: .3rem; border: 2px solid var(--surface); box-sizing: content-box; }
.dot.ok { background: var(--good); } .dot.bad { background: var(--recv); } .dot.busy { background: var(--c-exp); }
.ic { width: 1.5rem; height: 1.5rem; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

.view { display: none; } .view.on { display: block; }
.banner { background: var(--pay-bg); color: var(--pay); border-radius: 1.1rem; padding: .7rem .9rem; font-size: .85rem; font-weight: 700; display: flex; gap: .7rem; align-items: center; margin-bottom: .8rem; line-height: 1.5; }
.banner button { margin-inline-start: auto; background: transparent; border: 2px solid currentColor; color: inherit; border-radius: .8rem; padding: .35rem .8rem; font-size: .8rem; font-weight: 800; white-space: nowrap; min-height: 2.4rem; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 1.5rem; padding: 1rem; box-shadow: var(--shadow); margin-bottom: .8rem; min-width: 0; }
.card h3 { font-size: 1.1rem; font-weight: 800; margin: 0 0 .6rem; }
.sec-title { font-size: 1.15rem; font-weight: 800; margin: 1.2rem .2rem .5rem; display: flex; align-items: center; gap: .5rem; }
.muted { color: var(--muted); } .small { font-size: .85rem; }
.row { display: flex; gap: .6rem; align-items: center; } .grow { flex: 1; min-width: 0; }
.wrap { flex-wrap: wrap; }

.btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 1.1rem; padding: .6rem 1rem; min-height: 3.2rem; font-weight: 800; font-size: 1rem; display: inline-flex; gap: .5rem; align-items: center; justify-content: center; text-align: center; line-height: 1.3; }
.btn.primary { background: linear-gradient(160deg, var(--accent2), var(--accent)); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--recv); border-color: var(--recv); }
.btn.sm { padding: .35rem .8rem; font-size: .85rem; min-height: 2.6rem; border-radius: .9rem; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; }
.chips { display: flex; gap: .5rem; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: .4rem .95rem; min-height: 2.7rem; font-size: .9rem; font-weight: 700; line-height: 1.3; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface2); border-radius: 1.1rem; padding: .25rem; gap: .25rem; }
.seg button { border: 0; background: transparent; border-radius: .85rem; padding: .5rem .2rem; min-height: 2.8rem; font-weight: 800; font-size: .9rem; color: var(--muted); line-height: 1.25; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* التسجيل */
.stage { display: flex; flex-direction: column; align-items: center; gap: .6rem; padding: .6rem 0 .3rem; }
.mic { width: 8rem; height: 8rem; border-radius: 50%; border: 0; background: linear-gradient(150deg, var(--accent2), var(--accent)); color: var(--accent-ink); display: grid; place-items: center; position: relative; box-shadow: 0 10px 28px rgba(10,102,87,.38); }
.mic .ic { width: 3.4rem; height: 3.4rem; stroke-width: 1.7; }
.mic.live::before, .mic.live::after { content: ""; position: absolute; inset: -.5rem; border-radius: 50%; border: 3px solid var(--accent); opacity: .5; animation: ring 1.6s ease-out infinite; }
.mic.live::after { animation-delay: .8s; }
@keyframes ring { from { transform: scale(.9); opacity: .6; } to { transform: scale(1.35); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .mic.live::before, .mic.live::after { animation: none; } }
.status { min-height: 1.6rem; color: var(--ink); font-size: 1rem; font-weight: 700; text-align: center; line-height: 1.5; }
.thread { display: flex; flex-direction: column; gap: .55rem; margin: .7rem 0; }
.msg { scroll-margin-bottom: 7rem; max-width: 92%; padding: .6rem .9rem; border-radius: 1.2rem; font-size: 1.05rem; font-weight: 600; line-height: 1.55; }
.msg.bot { background: var(--surface); border: 1.5px solid var(--line); align-self: flex-start; border-start-start-radius: .35rem; }
.msg.me { background: var(--accent-soft); align-self: flex-end; border-start-end-radius: .35rem; }
.msg.interim { opacity: .65; }
.composer { display: flex; gap: .5rem; margin-top: .7rem; }
.composer input { flex: 1; min-width: 0; border: 2px solid var(--line); background: var(--surface); border-radius: 1.2rem; padding: .7rem 1rem; min-height: 3.4rem; font-size: 1.05rem; font-weight: 600; }
.composer .btn { width: 3.4rem; padding: 0; flex: none; }
.hint { font-size: .85rem; font-weight: 600; color: var(--muted); text-align: center; margin: .6rem .3rem .1rem; line-height: 1.6; }

.draft { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem 1rem; }
.draft .full { grid-column: 1 / -1; }
.kv small { display: block; color: var(--muted); font-size: .8rem; font-weight: 600; }
.kv b { font-size: 1.05rem; font-weight: 800; word-break: break-word; }
.type-badge { display: inline-block; padding: .1rem .75rem; border-radius: 999px; font-size: .85rem; font-weight: 800; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.type-badge.t-شراء, .type-badge.t-سداد { background: var(--pay-bg); color: var(--pay); }
.type-badge.t-مصروف { background: var(--surface2); color: var(--muted); }
.type-badge.t-تحصيل { background: var(--good-bg); color: var(--good); }

/* القوائم */
.item { display: flex; gap: .7rem; align-items: center; padding: .8rem .1rem; min-height: 3.6rem; border-bottom: 1px solid var(--line); background: transparent; border-inline: 0; border-top: 0; width: 100%; text-align: start; }
.item:last-child { border-bottom: 0; }
.item .t { font-weight: 800; font-size: 1.02rem; } .item .s { font-size: .82rem; font-weight: 600; color: var(--muted); }
.amt { font-weight: 800; white-space: nowrap; font-size: 1.05rem; }
.amt.pos { color: var(--good); } .amt.neg { color: var(--recv); }
.pill { font-size: .78rem; font-weight: 800; padding: .1rem .65rem; border-radius: 999px; white-space: nowrap; display: inline-block; }
.pill.late { background: var(--recv-bg); color: var(--recv); } .pill.soon { background: var(--pay-bg); color: var(--pay); } .pill.ok { background: var(--good-bg); color: var(--good); }
.day { font-size: .85rem; color: var(--muted); margin: .9rem .2rem .1rem; font-weight: 800; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: .6rem; margin-bottom: .8rem; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 1.2rem; padding: .7rem .85rem; min-width: 0; box-shadow: var(--shadow); }
.kpi small { color: var(--muted); font-size: .8rem; font-weight: 700; display: block; line-height: 1.4; }
.kpi b { font-size: 1.35rem; font-weight: 900; display: block; margin: .1rem 0; line-height: 1.3; }
.kpi .d { font-size: .75rem; font-weight: 700; display: block; line-height: 1.4; }
.kpi.big { grid-column: 1 / -1; background: linear-gradient(150deg, var(--accent2), var(--accent)); color: var(--accent-ink); border-color: var(--accent); }
.kpi.big small { color: inherit; opacity: .92; }
.kpi.big b { font-size: 2rem; }
.up { color: var(--good); } .down { color: var(--recv); }
.kpi.big .up, .kpi.big .down { color: inherit; opacity: .95; }
.chart { width: 100%; overflow-x: auto; }
.chart svg { width: 100%; height: auto; display: block; min-width: 300px; font-family: var(--f); }
.legend { display: flex; gap: .9rem; flex-wrap: wrap; font-size: .82rem; font-weight: 700; color: var(--muted); margin-top: .4rem; }
.legend i { display: inline-block; width: .7rem; height: .7rem; border-radius: 3px; margin-inline-end: .3rem; vertical-align: -1px; }
.bar-row { display: grid; grid-template-columns: minmax(5rem, 34%) 1fr auto; gap: .5rem; align-items: center; margin: .5rem 0; font-size: .9rem; font-weight: 700; }
.bar-row .track { height: .7rem; background: var(--surface2); border-radius: 6px; overflow: hidden; }
.bar-row .fill { height: 100%; border-radius: 6px; background: var(--accent); }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-bottom: .6rem; }
.tile { border-radius: 1.2rem; padding: .8rem; min-width: 0; }
.tile small { display: block; font-size: .8rem; font-weight: 700; line-height: 1.4; } .tile b { font-size: 1.35rem; font-weight: 900; }
.tile.r { background: var(--recv-bg); color: var(--recv); } .tile.p { background: var(--pay-bg); color: var(--pay); } .tile.g { background: var(--good-bg); color: var(--good); } .tile.n { background: var(--surface2); }
.acts { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .7rem; }
.acts a.btn { text-decoration: none; color: inherit; }
.inv { display: flex; justify-content: space-between; gap: .5rem; font-size: .88rem; font-weight: 600; padding: .4rem 0; border-top: 1px dashed var(--line); }

/* التنقل */
.tabbar { position: fixed; z-index: 35; inset: auto max(.6rem, env(safe-area-inset-left, 0px)) calc(.6rem + env(safe-area-inset-bottom, 0px)) max(.6rem, env(safe-area-inset-right, 0px));
  background: var(--surface); border: 1px solid var(--line); border-radius: 1.8rem; box-shadow: 0 8px 30px rgba(15,43,38,.2); display: grid; grid-template-columns: repeat(5, 1fr); padding: .35rem; gap: .15rem; max-width: 36rem; margin-inline: auto; }
.tab { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .05rem; padding: .35rem .1rem; min-height: 3.6rem; color: var(--muted); font-size: .72rem; font-weight: 800; position: relative; border-radius: 1.3rem; line-height: 1.3; }
.tab .ic { width: 1.6rem; height: 1.6rem; }
.tab.on { color: var(--accent-ink); background: linear-gradient(160deg, var(--accent2), var(--accent)); }
.badge { position: absolute; top: .15rem; inset-inline-end: 18%; background: var(--recv); color: #fff; font-size: .68rem; font-weight: 800; min-width: 1.15rem; height: 1.15rem; border-radius: .6rem; display: grid; place-items: center; padding: 0 .25rem; }

/* نافذة */
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(6,18,14,.6); display: none; align-items: flex-end; justify-content: center; }
.overlay.on { display: flex; }
.sheet { background: var(--bg); width: 100%; max-width: 36rem; max-height: 94%; overflow-y: auto; border-radius: 1.8rem 1.8rem 0 0; padding: 1.1rem max(.9rem, env(safe-area-inset-left, 0px)) calc(1.3rem + env(safe-area-inset-bottom, 0px)); }
.sheet h2 { font-size: 1.35rem; font-weight: 900; margin: 0 0 .7rem; }
.field { display: block; margin-bottom: .7rem; } .field > span { display: block; font-size: .85rem; font-weight: 700; color: var(--muted); margin-bottom: .2rem; }
.field input, .field select, .field textarea { width: 100%; border: 2px solid var(--line); background: var(--surface); border-radius: 1rem; padding: .6rem .8rem; min-height: 3.1rem; min-width: 0; font-weight: 600; }
.field input[type=date], .field input[type=number] { direction: ltr; text-align: right; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.toast { position: fixed; inset-inline: 1rem; bottom: calc(5.8rem + env(safe-area-inset-bottom, 0px)); z-index: 80; background: var(--ink); color: var(--bg); padding: .8rem 1rem; border-radius: 1.1rem; text-align: center; font-weight: 800; font-size: 1rem; line-height: 1.5; opacity: 0; transform: translateY(10px); transition: .25s; pointer-events: none; max-width: 32rem; margin-inline: auto; }
.toast.on { opacity: 1; transform: none; }
.empty { text-align: center; color: var(--muted); padding: 1.2rem .6rem; font-size: 1rem; font-weight: 600; }
.say { background: var(--accent-soft); color: var(--ink); border-radius: 1.2rem; padding: .8rem 1rem; font-weight: 800; font-size: 1.05rem; line-height: 1.6; margin-bottom: .8rem; display: flex; gap: .6rem; align-items: flex-start; }
.search-box { display: flex; gap: .5rem; }
.search-box input { flex: 1; min-width: 0; border: 2px solid var(--line); background: var(--surface); border-radius: 1.2rem; padding: .7rem 1rem; min-height: 3.4rem; font-size: 1.05rem; font-weight: 600; }
.mic.small { width: 3.4rem; height: 3.4rem; box-shadow: none; flex: none; border-radius: 1.2rem; }
.mic.small .ic { width: 1.7rem; height: 1.7rem; }
.mic.small.live::before, .mic.small.live::after { border-radius: 1.2rem; inset: -.25rem; }
.scroll-x { overflow-x: auto; }

/* مفتاح الدفتر: تجارة / شخصي */
.seg.book { margin: 0 0 .8rem; }
.seg.book button { font-size: 1rem; min-height: 3rem; }
.seg.book button.on { background: linear-gradient(160deg, var(--accent2), var(--accent)); color: var(--accent-ink); }
:root[data-book="p"] { --accent: #5a3d9e; --accent2: #7656c2; --accent-soft: #e6def6; --accent-ink: #ffffff; --c-sales: #5a3d9e; }
@media (prefers-color-scheme: dark) {
  :root[data-book="p"]:not([data-theme="light"]) { --accent: #b9a2f5; --accent2: #9c82e6; --accent-soft: #2b2145; --accent-ink: #1a1030; --c-sales: #b9a2f5; }
}
:root[data-theme="dark"][data-book="p"] { --accent: #b9a2f5; --accent2: #9c82e6; --accent-soft: #2b2145; --accent-ink: #1a1030; --c-sales: #b9a2f5; }

/* المهام */
.task { background: var(--surface); border: 1.5px solid var(--line); border-radius: 1.4rem; padding: .85rem .95rem; margin-bottom: .6rem; box-shadow: var(--shadow); }
.task.ring { border-color: var(--recv); background: var(--recv-bg); }
.task .tt { font-size: 1.12rem; font-weight: 800; line-height: 1.45; word-break: break-word; }
.task .tw { font-size: .9rem; font-weight: 700; color: var(--muted); margin-top: .15rem; }
.task.ring .tw { color: var(--recv); }
.task .tags { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .4rem; }
.tag { font-size: .76rem; font-weight: 800; padding: .08rem .65rem; border-radius: 999px; background: var(--surface2); color: var(--muted); white-space: nowrap; }
.tag.money { background: var(--pay-bg); color: var(--pay); } .tag.pers { background: var(--accent-soft); color: var(--accent); } .tag.rep { background: var(--good-bg); color: var(--good); }
.task .acts { margin-top: .6rem; }
.alarm-bar { background: var(--pay-bg); color: var(--pay); border-radius: 1.1rem; padding: .7rem .9rem; font-weight: 700; font-size: .88rem; line-height: 1.55; margin-bottom: .8rem; }
.alarm-bar .btn { margin-top: .5rem; }

/* شاشة الألارم */
.alarm { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 1rem max(1rem, env(safe-area-inset-left, 0px)) calc(1rem + env(safe-area-inset-bottom, 0px)); overflow-y: auto;
  background: radial-gradient(circle at 50% 18%, #c0281a, #7d140b 70%); color: #fff; animation: alpulse 1.4s ease-in-out infinite; }
@keyframes alpulse { 50% { filter: brightness(1.18); } }
@media (prefers-reduced-motion: reduce) { .alarm { animation: none; } }
.alarm-in { width: 100%; max-width: 30rem; display: flex; flex-direction: column; align-items: center; gap: .7rem; text-align: center; }
.alarm-bell { width: 5.5rem; height: 5.5rem; border-radius: 50%; background: rgba(255,255,255,.18); display: grid; place-items: center; animation: albell .5s ease-in-out infinite alternate; }
.alarm-bell .ic { width: 3rem; height: 3rem; stroke-width: 1.8; }
@keyframes albell { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
@media (prefers-reduced-motion: reduce) { .alarm-bell { animation: none; } }
.alarm-kind { font-size: 1rem; font-weight: 800; background: rgba(255,255,255,.2); border-radius: 999px; padding: .15rem 1rem; }
.alarm-title { font-size: 2rem; font-weight: 900; line-height: 1.4; word-break: break-word; }
.alarm-sub { font-size: 1.1rem; font-weight: 700; opacity: .95; line-height: 1.5; }
.alarm-list { width: 100%; text-align: start; font-size: 1.02rem; font-weight: 700; line-height: 1.55; }

/* ---------- تشغيل ---------- */
function handleAlarmAction(key, act) {
  if (!key) return;
  if (key.indexOf('t:') === 0) {
    var t = S.tasks.filter(function (x) { return 't:' + x.id === key; })[0];
    if (t && t.status === 'open') { if (act === 'done') { completeTask(t); toast('تمام، شطبتها'); } else if (act === 'snooze') { snoozeTask(t, 10); toast('اتأجّلت 10 دقايق'); } }
  } else if (key.indexOf('d:') === 0 && act === 'done') { S.set.digestAck = today(); persist(); }
  if (AL.cur && AL.cur.key === key) stopRing();

}

}

}
function toCSV(rows) {

var P = { type: 'month', anchor: today() };

  var n = bk.length, slot = iw / n, bw = Math.min(14, slot / 3.6), s = '<svg viewBox="0 0 ' + W + ' ' + H + '" direction="ltr" role="img" aria-label="رسم بياني للمبيعات والمشتريات والمصروفات">';

    var keep = { d: R.draft, s: R.slot, m: R.mode }; R.draft = null; R.slot = null; R.mode = 'idle';
    aiInterpret('بعت لأحمد السيد خمسة آلاف جنيه كاش').then(function (r) { R.draft = keep.d; R.slot = keep.s; R.mode = keep.m; toast('فهمت: ' + (r.type || '؟') + ' — ' + (r.party || '؟') + ' — ' + C.fmt(r.total || 0) + ' جنيه'); },
      function (e) { R.draft = keep.d; R.slot = keep.s; R.mode = keep.m; toast('الفهم الذكي ما اشتغلش' + (e && e.message ? ': ' + String(e.message).slice(0, 80) : '')); });
  };
  $('s_sync').onclick = function () { saveFields(); S.entries.forEach(function (e) { if (!isDemo(e)) e._dirty = true; }); S.tasks.forEach(function (t) { t._dirty = true; }); S.set.cfgDirty = true; sync(true); };
  bindAlarmSettings();
  $('s_expers').onclick = function () { exportBook('الدفتر-الشخصي', [{ name: 'القيود', rows: [LEDGER_HEAD].concat(ledgerRows(C.live(E('شخصي')).sort(function (a, b) { return a.date < b.date ? -1 : 1; }))) }, { name: 'المهام والتذكيرات', rows: [['المهمة', 'الميعاد', 'النوع', 'المبلغ', 'الاسم', 'التكرار', 'الحالة']].concat(liveTasks().filter(function (t) { return t.book === 'شخصي'; }).map(function (t) { return [t.title, t.due ? toLocalInput(t.due).replace('T', ' ') : '', t.kind === 'pay' ? 'سداد' : t.kind === 'collect' ? 'تحصيل' : 'مهمة', t.amount, t.party, REPS[t.repeat || ''], t.status === 'done' ? 'تمت' : 'مفتوحة']; })) }]); };
  $('s_close').onclick = function () { saveFields(); closeSheet(); refresh(); };
  $('s_export').onclick = function () { exportBook(isPers() ? 'الدفتر-الشخصي' : 'كل-القيود', [{ name: 'القيود', rows: [LEDGER_HEAD].concat(ledgerRows(C.live(E()).sort(function (a, b) { return a.date < b.date ? -1 : 1; }))) }]); };
  $('s_demo').onclick = function () { if (!S.entries.some(isDemo)) { S.entries = S.entries.concat(demoEntries()); persist(); refresh(); toast('اتحمّلت بيانات تجريبية'); } else toast('البيانات التجريبية موجودة'); };
}

/* ---------- التشغيل ---------- */
function init() {
  applyTheme();
  if (!S.entries.length && !S.set.demoDone) { S.entries = demoEntries(); S.set.demoDone = true; persist(); }
  $('examples').innerHTML = 'تقدر تدوس على مايك الكيبورد واتكلم بدل ما تكتب.<br>قول مثلاً: «' + esc(EXAMPLE) + '» <br><button class="chip" id="tryEx" type="button" style="margin-top:6px">جرّب المثال</button>';
  $('tryEx').onclick = function () { if (R.draft) cancelDraft(); handleText(EXAMPLE); };
  document.querySelectorAll('.tab').forEach(function (t) { t.onclick = function () { switchView(t.dataset.v); }; });
  $('micBtn').onclick = function () { micToggle(false); };
  $('handsFree').onclick = function () { S.set.hands = !S.set.hands; syncHands(); if (S.set.hands) { S.set.speak = true; if (!listening) micToggle(true); } else { stopListen(); updateMic(); } };
  $('composer').onsubmit = function (ev) { ev.preventDefault(); var v = $('textIn').value; $('textIn').value = ''; stopListen(); handleText(v); };
  $('manualBtn').onclick = function () { openEdit({}, 'new'); };
  $('cancelDraft').onclick = cancelDraft;
  $('settingsBtn').onclick = openSettings;
  $('fsBtn').onclick = function () { S.set.fs = ((S.set.fs == null ? 1 : S.set.fs) + 1) % 3; applyTheme(); persist(); toast('حجم الخط: ' + ['عادي', 'كبير', 'كبير جدًا'][S.set.fs]); };
  $('syncBtn').onclick = function () { if (S.set.url && S.set.token) sync(true); else openSettings(); };
  $('overlay').onclick = function (ev) { if (ev.target === $('overlay')) closeSheet(); };
  $('clearDemo').onclick = function () { S.entries = S.entries.filter(function (e) { return !isDemo(e); }); S.set.demoDone = true; persist(); refresh(); toast('اتمسحت البيانات التجريبية'); };
  $('qIn').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { stopListen(); runSearch($('qIn').value, false); } });
  $('qMic').onclick = function () {
    if (listening) { stopListen(); $('qMic').classList.remove('live'); return; }
    startListen({
      onStart: function () { $('qMic').classList.add('live'); $('qStatus').textContent = 'بسمعك... قول اللي عايز تدوّر عليه'; },
      onInterim: function (t) { $('qIn').value = t; },
      onFinal: function (t, alts) { $('qIn').value = t; runSearch(t, true, alts); },
      onEnd: function () { $('qMic').classList.remove('live'); $('qStatus').textContent = ''; },
      onError: function (c) { $('qMic').classList.remove('live'); $('qStatus').textContent = micErrorText(c); }
    });
  };
  $('repSeg').querySelectorAll('button').forEach(function (b) { b.onclick = function () { P.type = b.dataset.p; P.anchor = today(); renderReport(); }; });
  $('repPrev').onclick = function () { P.anchor = C.shiftAnchor(P.type, P.anchor, -1); renderReport(); };
  $('repNext').onclick = function () { P.anchor = C.shiftAnchor(P.type, P.anchor, 1); renderReport(); };
  $('logQ').oninput = function () { LOG.q = this.value; renderLog(); };
  $('exportBtn').onclick = function () { exportBook(isPers() ? 'الدفتر-الشخصي' : 'كل-القيود', [{ name: 'القيود', rows: [LEDGER_HEAD].concat(ledgerRows(C.live(E()).sort(function (a, b) { return a.date < b.date ? -1 : 1; }))) }]); };
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeSheet(); });
  initTasks(); syncHands(); refresh(); updateMic();
  if (S.set.url && S.set.token) { setSync('', 'جاري الاتصال'); sync(false); }
  setInterval(function () { if (!document.hidden) sync(false); }, 120000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { refresh(); sync(false); } });
  window.addEventListener('online', function () { sync(false); });
  try { if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0 && location.hostname !== '') navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
}
init();

})();
</script>
